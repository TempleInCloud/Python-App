name: ci

on:
  push:
    paths:
      - src/**
    branches:
      - main 

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shorten commit id
        shell: bash
        run: echo "COMMIT_ID=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Debug commit id
        run: echo "COMMIT_ID is $COMMIT_ID"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
        push: true
        tags: templeincloud/python-app:${{ env.COMMIT_ID }}