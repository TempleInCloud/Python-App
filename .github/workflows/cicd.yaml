name: cicd

on:
  push:
    paths:
      - "src/**"
      - "charts/**"
      - ".github/workflows/cicd.yaml"
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_REPO: templeincloud/python-app
  VALUES_FILE: charts/python-app/values.yaml
  APP_NAME: python-app
  ARGO_NAMESPACE: aargocd
  ARGO_SERVER: argocd-server.aargocd.svc.cluster.local
  YQ_PATH: ".image.tag"

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ steps.vars.outputs.commit_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shorten commit id
        id: vars
        shell: bash
        run: |
          echo "commit_id=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"

      - name: Debug commit id
        run: echo "COMMIT_ID is ${{ steps.vars.outputs.commit_id }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.commit_id }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          set -e
          YQ_VERSION="v4.44.3"
          curl -sSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x yq
          ./yq --version

      - name: Update charts values.yaml with new tag
        shell: bash
        run: |
          set -e
          NEW_TAG="${{ needs.ci.outputs.commit_id }}"
          echo "Updating $VALUES_FILE -> $YQ_PATH = $NEW_TAG"
          ./yq -i "${YQ_PATH} = \"${NEW_TAG}\"" "${VALUES_FILE}"
          echo "Updated file:"
          cat "${VALUES_FILE}"

      - name: Commit and push updated values.yaml
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore: update image tag to ${{ needs.ci.outputs.commit_id }}" || echo "No changes to commit"
          git push

      - name: Install ArgoCD CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd version --client

      - name: Get ArgoCD admin password from cluster
        shell: bash
        run: |
          set -e
          # this secret name matches what you showed: argocd-initial-admin-secret
          PASS=$(kubectl -n "${ARGO_NAMESPACE}" get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 --decode)
          echo "::add-mask::$PASS"
          echo "ARGOCD_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Login to ArgoCD
        shell: bash
        run: |
          set -e
          ./argocd login "${ARGO_SERVER}" \
            --grpc-web \
            --insecure \
            --username admin \
            --password "${ARGOCD_PASSWORD}"

      - name: Sync application
        shell: bash
        run: |
          set -e
          ./argocd app sync "${APP_NAME}"
          ./argocd app wait "${APP_NAME}" --health --timeout 300